# fly.toml — Fly.io app config for nl2protocol hosted demo.
#
# Setup:
#   1. Install flyctl: `brew install flyctl` (mac) or see fly.io/docs
#   2. Authenticate:  `fly auth login`
#   3. Create the app: `fly apps create <unique-name>` and update the
#      `app` line below with that name (Fly enforces global uniqueness).
#   4. Deploy:        `fly deploy`
#
# This config assumes the container runs `nl2protocol --serve` on port
# 8080 (matches the Dockerfile CMD). auto_stop_machines = 'off' is the
# always-warm switch: Fly's proxy never stops the machine, so first-click
# latency stays sub-second. min_machines_running has no effect when
# auto_stop is off — kept at 0 for clarity. Scale stays at 1 machine.
# (min_machines_running is passive: floors the autostop loop, never
# starts a stopped machine. Don't use it as a warm-up mechanism.)

app = 'nl2protocol-aryan'
primary_region = 'iad'    # us-east; change to your closest region

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
